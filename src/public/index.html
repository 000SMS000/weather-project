<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  transition: background 0.7s ease;
  overflow: hidden;
}

.container {
  text-align: center;
  width: 350px;
  z-index: 1;
}

h1 {
  margin-bottom: 20px;
  font-weight: 600;
}

.search-box {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

button {
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: #ff9800;
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #e68900;
}

.card {
  margin-top: 25px;
  padding: 20px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.15);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  display: none;
  animation: fadeIn 0.5s ease-in-out;
  position: relative;
}

.card h2 {
  margin-bottom: 10px;
}

.temp {
  font-size: 40px;
  font-weight: 600;
  margin: 10px 0;
}

.icon {
  font-size: 50px;
}

.city-image {
  width: 100%;
  height: 150px;
  border-radius: 10px;
  object-fit: cover;
  margin-bottom: 15px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
  <h1>🌤 Weather App</h1>

  <div class="search-box">
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Search</button>
  </div>

  <div class="card" id="result"></div>
</div>

<script>
async function getWeather() {
  const city = document.getElementById("city").value;
  if (!city) return;

  const res = await fetch(`/weather?city=${city}`);
  const data = await res.json();

  const resultDiv = document.getElementById("result");

  if (data.error) {
    resultDiv.innerHTML = `<p>${data.error}</p>`;
  } else {

    let icon = "🌤";
    let bgColor = "linear-gradient(135deg, #1e3c72, #2a5298)";
    if (data.condition.toLowerCase().includes("cloud")) { icon = "☁"; bgColor = "linear-gradient(135deg, #485563, #29323c)"; }
    if (data.condition.toLowerCase().includes("rain")) { icon = "🌧"; bgColor = "linear-gradient(135deg, #000428, #004e92)"; }
    if (data.condition.toLowerCase().includes("clear")) { icon = "☀"; bgColor = "linear-gradient(135deg, #fceabb, #f8b500)"; }
    if (data.condition.toLowerCase().includes("snow")) { icon = "❄"; bgColor = "linear-gradient(135deg, #83a4d4, #b6fbff)"; }

    resultDiv.innerHTML = `
      <div class="icon">${icon}</div>
      <h2>${data.city}</h2>
      <div class="temp">${data.temperature}</div>
      <p>${data.condition}</p>
      <small>${new Date(data.timestamp).toLocaleString()}</small>
    `;

    resultDiv.style.display = "block";
    document.body.style.background = bgColor;
  }
}
</script>

</body>
</html>
